<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workout App 联调页</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Workout App</p>
      <h1>训练计划与打卡联调页</h1>
      <p class="muted">仅调用当前已验证的真实后端 API；提醒测试为 mock/disabled，不连接微信或钉钉。</p>
    </div>
    <button id="refreshAll" type="button">刷新全部</button>
  </header>

  <main class="grid">
    <section class="card" id="healthCard">
      <h2>API 状态</h2>
      <div id="health" class="status pending">待检测</div>
    </section>

    <section class="card wide">
      <div class="section-head">
        <h2>今日计划</h2>
        <span id="todayDate" class="pill"></span>
      </div>
      <div id="todayPlan" class="content-block"></div>
      <div class="actions">
        <button id="completeBtn" type="button">完成</button>
        <button id="skipBtn" type="button">跳过</button>
        <button id="postponeBtn" type="button">延期</button>
      </div>
      <label class="note-label">操作备注 <input id="actionNotes" placeholder="可选" /></label>
    </section>

    <section class="card wide">
      <h2>周计划</h2>
      <div id="weekPlan" class="list"></div>
    </section>

    <section class="card wide">
      <h2>月计划</h2>
      <div id="monthPlan" class="list compact"></div>
    </section>

    <section class="card wide">
      <h2>月历</h2>
      <div id="calendar" class="calendar"></div>
    </section>

    <section class="card">
      <h2>统计</h2>
      <div id="stats" class="stats"></div>
    </section>

    <section class="card">
      <h2>设置读取/保存</h2>
      <div id="settings" class="content-block"></div>
      <div class="form-row">
        <input id="settingKey" placeholder="key，例如 reminder_time" />
        <input id="settingValue" placeholder="value，例如 07:30" />
        <button id="saveSetting" type="button">保存设置</button>
      </div>
    </section>

    <section class="card wide">
      <h2>提醒测试</h2>
      <p class="warning">mock/disabled：后端只返回 not_sent，不显示真实发送成功，不接微信/钉钉。</p>
      <div class="form-row">
        <input id="reminderTitle" placeholder="标题" value="训练提醒测试" />
        <input id="reminderMessage" placeholder="消息" value="这是 mock 提醒，不会真实发送" />
        <button id="testReminder" type="button">测试提醒</button>
      </div>
      <pre id="reminderResult"></pre>
    </section>

    <section class="card wide">
      <h2>最近操作日志</h2>
      <div id="logs" class="list compact"></div>
    </section>
  </main>

  <footer>
    <span>实际 API 调用记录：</span><code id="apiCalls"></code>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
