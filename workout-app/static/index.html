<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>运动提醒 App｜运动训练计划管理</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260615-planner-v1" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="planner-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand-block">
        <span class="brand-mark">动</span>
        <div>
          <strong>运动提醒 App</strong>
          <small>本地模式 · LocalStorage</small>
        </div>
      </div>
      <nav class="nav-list" id="navList">
        <button class="nav-item active" data-page="dashboard" type="button">仪表盘</button>
        <button class="nav-item" data-page="today" type="button">今日训练</button>
        <button class="nav-item" data-page="week" type="button">周计划</button>
        <button class="nav-item" data-page="month" type="button">月计划</button>
        <button class="nav-item" data-page="exerciseLibrary" type="button">动作库</button>
        <button class="nav-item" data-page="templateManager" type="button">训练模板</button>
        <button class="nav-item" data-page="videoLinks" type="button">视频链接</button>
        <button class="nav-item" data-page="settings" type="button">设置</button>
      </nav>
      <div class="ai-panel">
        <button class="ai-button" data-ai-disabled type="button">AI 辅助导入 <span>第二阶段开放</span></button>
        <button class="ai-button" data-ai-disabled type="button">AI 搜索视频 <span>第二阶段开放</span></button>
      </div>
      <div class="local-status">
        <span>本地数据已连接</span>
        <strong id="storageUsage">计算中</strong>
        <small>数据保存在本机</small>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar glass-card">
        <div>
          <p class="eyebrow">本地模式 · 数据仅保存在当前电脑 · 支持 JSON 导入 / 导出</p>
          <h1>运动提醒 App · 运动训练计划管理</h1>
        </div>
        <div class="top-actions">
          <span id="health" class="status-pill pending">服务检测中</span>
          <button id="openImportExport" class="btn secondary" type="button">导入 / 导出</button>
          <button id="startTodayTop" class="btn primary" type="button">开始今日训练</button>
        </div>
      </header>

      <section class="page active" data-page-panel="dashboard">
        <div class="dashboard-grid">
          <article class="hero-card glass-card" id="dashboardToday"></article>
          <aside class="stack">
            <section class="glass-card compact-card">
              <div class="section-head"><h2>月度统计</h2><span id="monthLabel"></span></div>
              <div id="stats" class="metric-grid"></div>
            </section>
            <section class="glass-card compact-card">
              <div class="section-head"><h2>今日相关视频</h2></div>
              <div id="todayVideos" class="video-list"></div>
            </section>
          </aside>
          <section class="glass-card wide-card">
            <div class="section-head"><h2>本周训练路线</h2><button class="text-btn" data-page-link="week" type="button">查看周计划</button></div>
            <div id="weekRoute" class="week-route"></div>
          </section>
          <section class="glass-card wide-card">
            <div class="section-head"><h2>月度训练计划</h2><div><button id="prevMonth" class="ghost-btn" type="button">上一月</button><button id="nextMonth" class="ghost-btn" type="button">下一月</button></div></div>
            <div id="monthCalendar" class="calendar-grid"></div>
          </section>
        </div>
      </section>

      <section class="page" data-page-panel="today">
        <div class="two-column">
          <article class="glass-card" id="todayDetail"></article>
          <aside class="glass-card">
            <div class="section-head"><h2>今日相关视频</h2></div>
            <div id="todayVideoDetail" class="video-list"></div>
          </aside>
        </div>
      </section>

      <section class="page" data-page-panel="week">
        <section class="glass-card">
          <div class="section-head"><h2>本周计划</h2><span class="legend"><i class="dot training"></i>训练日 <i class="dot rest"></i>休息日</span></div>
          <div id="weekPlan" class="week-editor"></div>
        </section>
      </section>

      <section class="page" data-page-panel="month">
        <section class="glass-card">
          <div class="section-head"><h2>月计划</h2><div><button id="prevMonthPage" class="ghost-btn" type="button">上一月</button><button id="nextMonthPage" class="ghost-btn" type="button">下一月</button></div></div>
          <div id="monthStats" class="metric-grid slim"></div>
          <div id="monthCalendarPage" class="calendar-grid large"></div>
        </section>
      </section>

      <section class="page" data-page-panel="exerciseLibrary">
        <section class="glass-card">
          <div class="section-head wrap">
            <div><h2>动作库</h2><p>动作是数据源，视频必须绑定在动作上。</p></div>
            <div class="toolbar"><input id="exerciseSearch" placeholder="搜索动作" /><select id="exerciseFilter"><option value="all">全部</option></select><button id="addExercise" class="btn primary" type="button">+ 新增动作</button></div>
          </div>
          <div id="exerciseList" class="card-list"></div>
        </section>
      </section>

      <section class="page" data-page-panel="templateManager">
        <section class="glass-card">
          <div class="section-head"><h2>训练模板</h2><button id="addTemplate" class="btn primary" type="button">+ 新建模板</button></div>
          <div id="templateList" class="template-grid"></div>
        </section>
      </section>

      <section class="page" data-page-panel="videoLinks">
        <section class="glass-card">
          <div class="section-head"><h2>视频链接</h2><p>默认视频跟随动作，训练执行页同步刷新。</p></div>
          <div id="videoLinkList" class="video-list expanded"></div>
        </section>
      </section>

      <section class="page" data-page-panel="settings">
        <div class="two-column">
          <section class="glass-card">
            <div class="section-head"><h2>JSON 导入 / 导出</h2></div>
            <div class="settings-actions">
              <button id="exportJson" class="btn primary" type="button">导出 JSON</button>
              <button id="openImport" class="btn secondary" type="button">导入 JSON</button>
              <button id="resetLocalData" class="btn warning" type="button">重置为默认数据</button>
            </div>
            <textarea id="jsonBox" placeholder="导出的 JSON 或待导入 JSON"></textarea>
            <div id="importPreview" class="info-box"></div>
          </section>
          <section class="glass-card">
            <div class="section-head"><h2>钉钉提醒验收</h2></div>
            <p class="info-box">保留真实钉钉接口。缺凭据时显示未配置，不把 mock 当成功。</p>
            <button id="sendDingTalk" class="btn secondary" type="button">发送今日钉钉提醒</button>
            <pre id="reminderResult"></pre>
          </section>
        </div>
      </section>

      <section class="page" data-page-panel="trainingSession">
        <section class="training-layout glass-card">
          <div id="trainingSession"></div>
        </section>
      </section>
    </main>
  </div>

  <dialog id="exerciseDialog" class="modal"><form method="dialog" id="exerciseForm" class="modal-form"></form></dialog>
  <dialog id="templateDialog" class="modal"><form method="dialog" id="templateForm" class="modal-form"></form></dialog>
  <dialog id="planDialog" class="modal"><form method="dialog" id="planForm" class="modal-form"></form></dialog>
  <dialog id="videoDialog" class="modal"><form method="dialog" id="videoForm" class="modal-form"></form></dialog>

  <script src="/static/app.js?v=20260615-planner-v1"></script>
</body>
</html>
